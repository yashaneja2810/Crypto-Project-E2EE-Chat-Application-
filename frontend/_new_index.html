<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureChat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
        }

        /* ── Auth overlay ── */
        #authSection {
            position: fixed; inset: 0;
            background: #0a0a0a;
            display: flex; align-items: center; justify-content: center;
            z-index: 100;
        }
        .auth-card {
            background: #111;
            border: 1px solid #222;
            border-radius: 14px;
            padding: 40px 36px;
            width: 100%; max-width: 380px;
        }
        .auth-card h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
        .auth-card p  { color: #555; font-size: 13px; margin-bottom: 28px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
        .form-group input {
            width: 100%; padding: 10px 14px;
            background: #1a1a1a; border: 1px solid #2a2a2a;
            border-radius: 8px; color: #fff; font-size: 14px; outline: none;
            transition: border-color .2s;
        }
        .form-group input:focus { border-color: #555; }
        .btn {
            width: 100%; padding: 12px;
            background: #fff; color: #000;
            border: none; border-radius: 8px;
            font-size: 14px; font-weight: 700; cursor: pointer;
            transition: background .15s;
        }
        .btn:hover { background: #e0e0e0; }
        .btn-secondary {
            background: transparent; color: #fff;
            border: 1px solid #333; margin-top: 10px;
        }
        .btn-secondary:hover { background: #1a1a1a; }
        #alertContainer { margin-top: 14px; }
        .alert { padding: 10px 14px; border-radius: 8px; font-size: 13px; }
        .alert-error   { background: #1f0000; border: 1px solid #5a0000; color: #ff8080; }
        .alert-success { background: #001f00; border: 1px solid #005a00; color: #80ff80; }
        .alert-info    { background: #0a0a1f; border: 1px solid #003366; color: #80b0ff; }
        #authProgress {
            display: none; margin-top: 12px;
            background: #111; border: 1px solid #222; border-radius: 8px;
            padding: 10px 12px; font-size: 11px; color: #888;
            max-height: 120px; overflow-y: auto;
        }
        #authProgress.show { display: block; }
        #authProgress div { margin-bottom: 2px; }

        /* ── Toast notifications ── */
        #toastContainer {
            position: fixed; top: 16px; right: 16px;
            z-index: 9999; display: flex; flex-direction: column; gap: 8px;
        }
        .toast {
            padding: 10px 16px; border-radius: 8px;
            font-size: 13px; font-weight: 500;
            animation: fadeIn .2s ease;
            min-width: 220px; max-width: 340px;
        }
        .toast-error   { background: #300; color: #f99; border: 1px solid #600; }
        .toast-success { background: #030; color: #9f9; border: 1px solid #060; }
        .toast-info    { background: #003; color: #99f; border: 1px solid #006; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

        /* ── Chat shell ── */
        #chatSection {
            display: none;
            height: 100vh; flex-direction: row;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: 280px; flex-shrink: 0;
            background: #111; border-right: 1px solid #1e1e1e;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .sidebar-header {
            padding: 14px 16px; border-bottom: 1px solid #1e1e1e;
            display: flex; align-items: center; gap: 10px;
        }
        .my-avatar {
            width: 34px; height: 34px; border-radius: 50%;
            background: #fff; color: #000;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700; flex-shrink: 0;
        }
        .my-info { flex: 1; min-width: 0; }
        .my-name {
            font-size: 13px; font-weight: 600; color: #fff;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .logout-btn {
            background: none; border: none; color: #444; cursor: pointer;
            font-size: 16px; padding: 4px 6px; border-radius: 4px;
            transition: color .2s; flex-shrink: 0; line-height: 1;
        }
        .logout-btn:hover { color: #fff; }

        /* search */
        .search-wrap {
            padding: 10px 12px; border-bottom: 1px solid #1e1e1e;
            position: relative;
        }
        .search-input {
            width: 100%; padding: 8px 12px;
            background: #1a1a1a; border: 1px solid #2a2a2a;
            border-radius: 20px; color: #fff; font-size: 13px; outline: none;
            transition: border-color .2s;
        }
        .search-input:focus { border-color: #444; }
        .search-input::placeholder { color: #333; }
        .search-results {
            display: none; position: absolute; left: 10px; right: 10px;
            top: calc(100% - 2px);
            background: #1a1a1a; border: 1px solid #2a2a2a;
            border-radius: 10px; z-index: 50; overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,.6);
        }
        .search-results.open { display: block; }
        .search-result-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; cursor: pointer;
            transition: background .15s;
        }
        .search-result-item:hover { background: #222; }
        .search-result-avatar {
            width: 32px; height: 32px; border-radius: 50%;
            background: #fff; color: #000;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 700; flex-shrink: 0;
        }

        /* recent chats list */
        #recentChats { flex: 1; overflow-y: auto; padding: 4px 0; }
        #recentChats::-webkit-scrollbar { width: 4px; }
        #recentChats::-webkit-scrollbar-track { background: transparent; }
        #recentChats::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }
        .chat-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; cursor: pointer;
            transition: background .15s;
        }
        .chat-item:hover { background: #1a1a1a; }
        .chat-item.active { background: #222; }
        .chat-item-avatar {
            width: 38px; height: 38px; border-radius: 50%;
            background: #fff; color: #000;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 700; flex-shrink: 0;
        }
        .chat-item-info { flex: 1; min-width: 0; }
        .chat-item-name { font-size: 14px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-item-preview { font-size: 12px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-item-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
        .chat-item-time { font-size: 11px; color: #444; }
        .unread-badge {
            background: #fff; color: #000;
            border-radius: 10px; font-size: 11px; font-weight: 700;
            padding: 1px 6px; min-width: 18px; text-align: center;
        }

        /* ── Main chat area ── */
        .chat-main {
            flex: 1; display: flex; flex-direction: column;
            background: #0d0d0d; overflow: hidden;
        }
        #emptyState {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: #333; gap: 12px;
        }
        #emptyState .empty-icon { font-size: 48px; }
        #emptyState p { font-size: 15px; }
        #activeChatArea {
            display: none; flex: 1; flex-direction: column; overflow: hidden;
        }
        .chat-topbar {
            height: 56px; background: #111; border-bottom: 1px solid #1e1e1e;
            display: flex; align-items: center; padding: 0 18px; gap: 12px;
            flex-shrink: 0;
        }
        .topbar-avatar {
            width: 34px; height: 34px; border-radius: 50%;
            background: #fff; color: #000;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700; flex-shrink: 0;
        }
        .topbar-name { font-size: 15px; font-weight: 600; }
        #messages {
            flex: 1; overflow-y: auto; padding: 16px 20px;
            display: flex; flex-direction: column; gap: 4px;
        }
        #messages::-webkit-scrollbar { width: 4px; }
        #messages::-webkit-scrollbar-track { background: transparent; }
        #messages::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }

        /* message bubbles */
        .msg-group { display: flex; flex-direction: column; max-width: 72%; }
        .msg-group.sent  { align-self: flex-end; align-items: flex-end; }
        .msg-group.received { align-self: flex-start; align-items: flex-start; }
        .msg-bubble {
            padding: 9px 14px; border-radius: 18px;
            font-size: 14px; line-height: 1.45; word-break: break-word;
        }
        .msg-group.sent .msg-bubble {
            background: #fff; color: #000;
            border-bottom-right-radius: 4px;
        }
        .msg-group.received .msg-bubble {
            background: #1e1e1e; color: #fff;
            border-bottom-left-radius: 4px;
        }
        .message-time { font-size: 10px; color: #444; margin-top: 3px; padding: 0 4px; }

        /* input bar */
        .chat-input-bar {
            display: flex; gap: 10px; padding: 12px 16px;
            background: #111; border-top: 1px solid #1e1e1e; flex-shrink: 0;
        }
        #messageInput {
            flex: 1; padding: 10px 14px; background: #1a1a1a;
            border: 1px solid #2a2a2a; border-radius: 20px;
            color: #fff; font-size: 14px; outline: none; resize: none;
            transition: border-color .2s;
        }
        #messageInput:focus { border-color: #444; }
        #messageInput::placeholder { color: #333; }
        #sendBtn {
            width: 40px; height: 40px; border-radius: 50%;
            background: #fff; color: #000; border: none;
            font-size: 18px; cursor: pointer; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            transition: background .15s;
        }
        #sendBtn:hover { background: #ddd; }
    </style>
</head>
<body>

<!-- Auth Screen -->
<div id="authSection">
    <div class="auth-card">
        <h1>SecureChat</h1>
        <p>End-to-end encrypted messaging</p>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Min 6 characters" autocomplete="current-password">
        </div>
        <button class="btn" id="loginBtn">Sign In</button>
        <button class="btn btn-secondary" id="signupBtn">Create Account</button>
        <div id="alertContainer"></div>
        <div id="authProgress"></div>
    </div>
</div>

<!-- Toast container (for chat-context alerts) -->
<div id="toastContainer"></div>

<!-- Chat Screen -->
<div id="chatSection">

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="my-avatar" id="myAvatar">?</div>
            <div class="my-info">
                <div class="my-name" id="currentUser">Loading...</div>
            </div>
            <button class="logout-btn" id="logoutBtn" title="Log out">&#x2715;</button>
        </div>

        <!-- Search -->
        <div class="search-wrap">
            <input type="text" class="search-input" id="searchInput" placeholder="Search people...">
            <div class="search-results" id="searchResults"></div>
        </div>

        <!-- Recent chats -->
        <div id="recentChats"></div>
    </div>

    <!-- Main area -->
    <div class="chat-main">

        <!-- Empty state -->
        <div id="emptyState">
            <div class="empty-icon">💬</div>
            <p>Select a conversation or search for someone</p>
        </div>

        <!-- Active chat -->
        <div id="activeChatArea">
            <div class="chat-topbar">
                <div class="topbar-avatar" id="topbarAvatar">?</div>
                <span class="topbar-name" id="recipientNameDisplay"></span>
            </div>
            <div id="messages"></div>
            <div class="chat-input-bar">
                <input type="text" id="messageInput" placeholder="Type a message...">
                <button id="sendBtn">&#x27A4;</button>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
<script src="config.js"></script>
<script src="crypto-helper.js"></script>
<script src="app.js"></script>
</body>
</html>
